name: Build & Publish OCI Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-images:
    name: Build & Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            image: ewp-api-gateway
            dockerfile: docker/Dockerfile.jvm
            build_args: MODULE=api-gateway
          - name: workflow-service
            image: ewp-workflow-service
            dockerfile: docker/Dockerfile.jvm
            build_args: MODULE=workflow-service
          - name: template-service
            image: ewp-template-service
            dockerfile: docker/Dockerfile.jvm
            build_args: MODULE=template-service
          - name: audit-analytics-service
            image: ewp-audit-analytics-service
            dockerfile: docker/Dockerfile.jvm
            build_args: MODULE=audit-analytics-service
          - name: frontend
            image: ewp-frontend
            dockerfile: docker/Dockerfile.frontend
            build_args: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Lowercase Repository Owner
        run: |
          echo "IMAGE_PREFIX=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
