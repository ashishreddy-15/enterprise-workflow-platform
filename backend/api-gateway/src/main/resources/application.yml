server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://localhost:4201"
              - "http://localhost:4202"
              - "http://localhost:4203"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      server:
        webflux:
          routes:
            - id: template-service-route
              uri: http://localhost:8083
              predicates:
                - Path=/templates/**

            - id: workflow-service-route
              uri: http://localhost:8081
              predicates:
                - Path=/workflows/**

            - id: audit-analytics-service-route
              uri: http://localhost:8082
              predicates:
                - Path=/analytics/**

logging:
  level:
    com.ashish.workflow.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
