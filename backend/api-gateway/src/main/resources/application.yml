server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost"
              - "http://localhost:*"
              - "http://127.0.0.1"
              - "http://127.0.0.1:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "*"
            allowCredentials: true
      server:
        webflux:
          routes:
            - id: template-service-route
              uri: http://localhost:8083
              predicates:
                - Path=/templates/**

            - id: workflow-service-route
              uri: http://localhost:8081
              predicates:
                - Path=/workflows/**

            - id: audit-analytics-service-route
              uri: http://localhost:8082
              predicates:
                - Path=/analytics/**

logging:
  level:
    com.ashish.workflow.gateway: DEBUG
    org.springframework.cloud.gateway: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
