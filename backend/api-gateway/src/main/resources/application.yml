server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    allow-circular-references: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${OAUTH2_CLIENT_ID}
            client-secret: ${OAUTH2_CLIENT_SECRET}
            scope: openid,profile,email,roles
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          azure:
            client-id: ${AZURE_CLIENT_ID}
            client-secret: ${AZURE_CLIENT_SECRET}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            authorization-uri: ${OAUTH2_AUTH_URI:http://localhost:8085/realms/ewp/protocol/openid-connect/auth}
            token-uri: ${OAUTH2_TOKEN_URI:http://localhost:8085/realms/ewp/protocol/openid-connect/token}
            user-info-uri: ${OAUTH2_USERINFO_URI:http://localhost:8085/realms/ewp/protocol/openid-connect/userinfo}
            jwk-set-uri: ${OAUTH2_JWKS_URI:http://localhost:8085/realms/ewp/protocol/openid-connect/certs}
            user-name-attribute: preferred_username
          azure:
            authorization-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            jwk-set-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/discovery/v2.0/keys
            user-name-attribute: sub
  cloud:
    gateway:
      observability:
        enabled: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost"
              - "http://localhost:*"
              - "http://127.0.0.1"
              - "http://127.0.0.1:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "*"
            allowCredentials: true
      server:
        webflux:
          routes:
            - id: template-service-route
              uri: http://localhost:8083
              predicates:
                - Path=/templates/**

            - id: workflow-service-route
              uri: http://localhost:8081
              predicates:
                - Path=/workflows/**

            - id: audit-analytics-service-route
              uri: http://localhost:8082
              predicates:
                - Path=/analytics/**

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.ashish.workflow.gateway: DEBUG
    org.springframework.cloud.gateway: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      transport: http
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:enterprise-workflow-platform}

ewp:
  auth:
    frontend-url: ${FRONTEND_URL:http://localhost/}
    session:
      idle-timeout-minutes: ${SESSION_IDLE_TIMEOUT_MINUTES:60}
      max-lifespan-hours: ${SESSION_MAX_LIFESPAN_HOURS:8}
      renew-threshold-minutes: ${SESSION_RENEW_THRESHOLD_MINUTES:15}
