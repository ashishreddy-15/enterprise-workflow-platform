server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    allow-circular-references: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${OAUTH2_CLIENT_ID:ewp-gateway}
            client-secret: ${OAUTH2_CLIENT_SECRET:ewp-client-secret-2026}
            scope: openid,profile,email,roles
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            authorization-uri: ${OAUTH2_AUTH_URI:http://localhost:8085/realms/ewp/protocol/openid-connect/auth}
            token-uri: ${OAUTH2_TOKEN_URI:http://localhost:8085/realms/ewp/protocol/openid-connect/token}
            user-info-uri: ${OAUTH2_USERINFO_URI:http://localhost:8085/realms/ewp/protocol/openid-connect/userinfo}
            jwk-set-uri: ${OAUTH2_JWKS_URI:http://localhost:8085/realms/ewp/protocol/openid-connect/certs}
            user-name-attribute: preferred_username
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost"
              - "http://localhost:*"
              - "http://127.0.0.1"
              - "http://127.0.0.1:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "*"
            allowCredentials: true
      server:
        webflux:
          routes:
            - id: template-service-route
              uri: http://localhost:8083
              predicates:
                - Path=/templates/**

            - id: workflow-service-route
              uri: http://localhost:8081
              predicates:
                - Path=/workflows/**

            - id: audit-analytics-service-route
              uri: http://localhost:8082
              predicates:
                - Path=/analytics/**

logging:
  level:
    com.ashish.workflow.gateway: DEBUG
    org.springframework.cloud.gateway: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
