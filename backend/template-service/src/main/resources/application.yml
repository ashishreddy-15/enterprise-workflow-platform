server:
  port: 8083
  servlet:
    context-path: /templates

spring:
  application:
    name: template-service

  threads:
    virtual:
      enabled: true

  mongodb:
    uri: ${SPRING_MONGODB_URI}
    uuid-representation: standard
    auto-index-creation: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
