server:
  port: 8081

spring:
  application:
    name: workflow-service

  # Enable Java 21 Virtual Threads for high concurrent I/O throughput
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/workflow_db
    username: ewp_user
    password: ewp_password
    driver-class-name: org.postgresql.Driver

  mongodb:
    uri: mongodb://ewp_admin:ewp_password@localhost:27017/template_db?authSource=admin&uuidRepresentation=standard
    uuid-representation: standard
    auto-index-creation: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

services:
  template-service:
    url: http://localhost:8083