services:
  # =====================================================================
  # 1. INFRASTRUCTURE SERVICES
  # =====================================================================

  postgres:
    image: postgres:16-alpine
    container_name: ewp-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ewp-network

  mongodb:
    image: mongo:7.0
    container_name: ewp-mongodb
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ewp-network

  redis:
    image: redis:7.2-alpine
    container_name: ewp-redis
    env_file:
      - .env
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ewp-network

  kafka:
    image: apache/kafka:3.8.0
    container_name: ewp-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - ewp-network

  # =====================================================================
  # 2. APPLICATION MICROSERVICES
  # =====================================================================

  template-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.jvm
      args:
        MODULE: template-service
    container_name: ewp-template-service
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      SPRING_MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGO_TEMPLATE_DB:-template_db}?authSource=admin&uuidRepresentation=standard
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      mongodb:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - ewp-network

  workflow-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.jvm
      args:
        MODULE: workflow-service
    container_name: ewp-workflow-service
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGO_TEMPLATE_DB:-template_db}?authSource=admin&uuidRepresentation=standard
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVICES_TEMPLATE_SERVICE_URL: http://template-service:8083/templates
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
      template-service:
        condition: service_started
      jaeger:
        condition: service_started
    networks:
      - ewp-network

  audit-analytics-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.jvm
      args:
        MODULE: audit-analytics-service
    container_name: ewp-audit-analytics-service
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      SPRING_MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGO_AUDIT_DB:-audit_db}?authSource=admin&uuidRepresentation=standard
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
      jaeger:
        condition: service_started
    networks:
      - ewp-network

  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.jvm
      args:
        MODULE: api-gateway
    container_name: ewp-api-gateway
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_ID: template-service-route
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_URI: http://template-service:8083
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_PREDICATES_0: Path=/templates/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_ID: workflow-service-route
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_URI: http://workflow-service:8081
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_PREDICATES_0: Path=/workflows/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_ID: audit-analytics-service-route
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_URI: http://audit-analytics-service:8082
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_PREDICATES_0: Path=/analytics/**
      OAUTH2_AUTH_URI: http://localhost:8085/realms/ewp/protocol/openid-connect/auth
      OAUTH2_TOKEN_URI: http://keycloak:8085/realms/ewp/protocol/openid-connect/token
      OAUTH2_JWKS_URI: http://keycloak:8085/realms/ewp/protocol/openid-connect/certs
      OAUTH2_USERINFO_URI: http://keycloak:8085/realms/ewp/protocol/openid-connect/userinfo
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID}
      OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES}
      SESSION_MAX_LIFESPAN_HOURS: ${SESSION_MAX_LIFESPAN_HOURS}
      SESSION_RENEW_THRESHOLD_MINUTES: ${SESSION_RENEW_THRESHOLD_MINUTES}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      - template-service
      - workflow-service
      - audit-analytics-service
      - jaeger
    networks:
      - ewp-network

  # =====================================================================
  # 2.5 IDENTITY & ACCESS MANAGEMENT (KEYCLOAK OIDC)
  # =====================================================================

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: ewp-keycloak
    command: start-dev --import-realm
    env_file:
      - .env
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: 8085
      KC_HOSTNAME: http://localhost:8085
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
      - ./keycloak-theme:/opt/keycloak/themes/ewp:ro
    ports:
      - "8085:8085"
    networks:
      - ewp-network

  # =====================================================================
  # 3. FRONTEND MICRO-FRONTENDS (NGINX)
  # =====================================================================

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: ewp-frontend
    ports:
      - "4200:4200"
      - "4201:4201"
      - "4202:4202"
      - "4203:4203"
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - ewp-network

  # =====================================================================
  # 4. OBSERVABILITY & DISTRIBUTED TRACING
  # =====================================================================

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: ewp-jaeger
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - ewp-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ewp-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    depends_on:
      - api-gateway
      - workflow-service
      - audit-analytics-service
      - template-service
    networks:
      - ewp-network

  grafana:
    image: grafana/grafana:10.4.1
    container_name: ewp-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
    networks:
      - ewp-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ewp-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:80
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - frontend
    networks:
      - ewp-network

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:

networks:
  ewp-network:
    driver: bridge
