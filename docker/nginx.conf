# ==============================================================================
# Enterprise Workflow Platform - Micro-Frontend Nginx Configuration
# ==============================================================================

# Enable Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

# ------------------------------------------------------------------------------
# 1. Shell (Host Application) - Port 4200
# ------------------------------------------------------------------------------
server {
    listen 4200;
    server_name localhost;

    root /usr/share/nginx/html/shell;
    index index.html;

    # HTML5 PushState routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    # Manifest and remote descriptors
    location = /federation.manifest.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        add_header Content-Type "application/json";
    }

    # Cache long-lived hashed assets
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }
}

# ------------------------------------------------------------------------------
# 2. Workflow MFE Remote - Port 4201
# ------------------------------------------------------------------------------
server {
    listen 4201;
    server_name localhost;

    root /usr/share/nginx/html/workflow-mfe;
    index index.html;

    # CORS headers for Native Federation remote consumption
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, HEAD" always;
    add_header Access-Control-Allow-Headers "*" always;

    location / {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, HEAD" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /remoteEntry.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Type "application/json" always;
    }

    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*" always;
    }
}

