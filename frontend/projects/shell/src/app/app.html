<div class="h-screen flex flex-col bg-zinc-50 text-zinc-900 overflow-hidden">
  <!-- Minimalist Top Navigation -->
  <header class="bg-white border-b border-zinc-200 flex-none h-14 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-full flex items-center justify-between">
      
      <!-- Brand & Navigation Links -->
      <div class="flex items-center gap-6">
        <a routerLink="/" class="flex items-center gap-2 font-semibold text-sm tracking-tight text-zinc-950">
          <span class="w-6 h-6 rounded bg-zinc-900 text-white flex items-center justify-center text-xs font-bold">W</span>
          <span>Workflow Platform</span>
        </a>

        <nav class="hidden sm:flex items-center gap-1 text-sm">
          <a routerLink="/workflows" routerLinkActive="bg-zinc-100 text-zinc-950 font-medium"
             class="px-2.5 py-1.5 rounded-md text-zinc-600 hover:text-zinc-950 hover:bg-zinc-50 transition">
            Inbox
          </a>
          <a routerLink="/templates" routerLinkActive="bg-zinc-100 text-zinc-950 font-medium"
             class="px-2.5 py-1.5 rounded-md text-zinc-600 hover:text-zinc-950 hover:bg-zinc-50 transition">
            Blueprints
          </a>
          <a routerLink="/analytics" routerLinkActive="bg-zinc-100 text-zinc-950 font-medium"
             class="px-2.5 py-1.5 rounded-md text-zinc-600 hover:text-zinc-950 hover:bg-zinc-50 transition">
            Analytics
          </a>
        </nav>
      </div>

      <!-- Persona Switcher -->
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 border border-zinc-200 rounded-md bg-white px-2 py-1 text-xs">
          <span class="w-2 h-2 rounded-full"
                [ngClass]="{
                  'bg-emerald-500': auth.isAuthenticated(),
                  'bg-amber-400 animate-pulse': auth.isAuthenticating(),
                  'bg-rose-500': !auth.isAuthenticated() && !auth.isAuthenticating()
                }">
          </span>

          <select [value]="auth.activePersona().id" (change)="onPersonaChange($event)"
                  class="bg-transparent font-medium text-zinc-800 outline-none cursor-pointer">
            @for (p of auth.personas; track p.id) {
              <option [value]="p.id">{{ p.name }} &bull; {{ p.role }}</option>
            }
          </select>
        </div>
      </div>

    </div>
  </header>

  <!-- Error Banner (Only shown if Gateway fails) -->
  @if (auth.authError()) {
    <div class="bg-amber-50 border-b border-amber-200 px-4 py-2 text-xs text-amber-900 flex justify-between items-center max-w-7xl mx-auto w-full flex-none">
      <span>{{ auth.authError() }} (Gateway: localhost:8080)</span>
      <button (click)="auth.switchPersona(auth.activePersona())" class="underline font-semibold hover:text-amber-950">
        Retry
      </button>
    </div>
  }

  <!-- Main Content Container: Scrollable area for dashboards and views -->
  <main class="flex-1 min-h-0 w-full max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col overflow-y-auto">
    <router-outlet></router-outlet>
  </main>

  <!-- Sleek Status Footer Bar -->
  <footer class="flex-none h-7 border-t border-zinc-200 bg-white px-6 flex items-center justify-between text-[11px] text-zinc-400 font-mono">
    <span>Enterprise Workflow Platform &bull; v1.0.0</span>
    <span class="flex items-center gap-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
      Gateway :8080 Connected
    </span>
  </footer>
</div>
