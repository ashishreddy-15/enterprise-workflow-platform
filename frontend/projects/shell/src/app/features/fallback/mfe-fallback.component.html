<div class="max-w-md mx-auto my-16 p-6 bg-white border border-zinc-200 rounded-lg text-center space-y-4">
  <div class="ewp-avatar-sm w-8 h-8 rounded-full bg-zinc-100 border border-zinc-200 text-zinc-600 mx-auto ewp-mono-value">
    MFE
  </div>
  
  <div>
    <h2 class="ewp-section-title">{{ remoteName }}</h2>
    <p class="ewp-muted mt-1 leading-relaxed">
      This Micro-Frontend module is configured at <code class="bg-zinc-100 px-1 py-0.5 rounded text-zinc-800">localhost:{{ expectedPort }}</code>.
    </p>
  </div>

  <div class="ewp-code-block">
    <div><span class="text-zinc-400">Status:</span> Standby / Phase 2</div>
    <div><span class="text-zinc-400">Entry:</span> :{{ expectedPort }}/remoteEntry.json</div>
    <div><span class="text-zinc-400">Route:</span> {{ exposedRoutes }}</div>
  </div>
</div>
