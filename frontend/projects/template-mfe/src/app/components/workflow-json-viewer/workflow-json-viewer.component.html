<div class="ewp-card overflow-hidden">
  <div class="px-4 py-2.5 bg-zinc-50 border-b border-zinc-200 flex items-center justify-between text-xs">
    <div class="flex items-center gap-2">
      <span class="font-mono text-zinc-500 font-bold">&#123; &#125;</span>
      <span class="font-mono text-[11px] text-zinc-700 font-semibold">{{ title() }}</span>
    </div>

    <button (click)="copyToClipboard()"
            type="button"
            class="px-2.5 py-1 rounded border border-zinc-200 hover:bg-zinc-100 bg-white text-zinc-800 text-[11px] font-mono font-medium transition cursor-pointer flex items-center gap-1.5 shadow-2xs">
      <span>{{ isCopied() ? '✓' : '⧉' }}</span>
      <span>{{ isCopied() ? 'Copied!' : 'Copy JSON' }}</span>
    </button>
  </div>

  <div class="p-4 bg-zinc-950 overflow-auto font-mono text-xs text-emerald-400 select-all"
       [style.maxHeight]="maxHeight()">
    <pre class="m-0 leading-relaxed">{{ json() }}</pre>
  </div>
</div>
